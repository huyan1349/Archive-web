<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 340px;
      margin: 0;
      padding: 16px;
      font-family: Georgia, "Times New Roman", serif;
      background: #f7edda;
      color: #231b13;
      line-height: 1.5;
    }
    .brand {
      font-size: 12px;
      color: #877764;
      letter-spacing: 0.08em;
      margin-bottom: 4px;
    }
    h3 {
      margin: 0 0 8px;
      font-size: 15px;
      font-weight: 400;
    }
    .status {
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      margin: 6px 0;
      border: 1px solid transparent;
    }
    .status-ok { background: rgba(109,114,89,0.12); color: #4a523c; border-color: rgba(109,114,89,0.2); }
    .status-err { background: rgba(159,79,45,0.1); color: #9f4f2d; border-color: rgba(159,79,45,0.18); }
    .status-warn { background: rgba(189,122,54,0.1); color: #bd7a36; border-color: rgba(189,122,54,0.2); }

    .cookie-area {
      margin-top: 8px;
      display: none;
    }
    .cookie-area.visible {
      display: block;
    }
    textarea {
      width: 100%;
      height: 80px;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid rgba(49,34,20,0.2);
      background: rgba(255,255,255,0.6);
      color: #231b13;
      font-family: 'SF Mono', 'Menlo', 'Monaco', monospace;
      font-size: 11px;
      line-height: 1.4;
      resize: none;
      box-sizing: border-box;
    }
    textarea:focus {
      outline: none;
      border-color: rgba(109,114,89,0.4);
    }
    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    button {
      flex: 1;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid rgba(49,34,20,0.2);
      background: rgba(255,255,255,0.45);
      color: #231b13;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover:not(:disabled) {
      background: rgba(255,255,255,0.7);
    }
    button:disabled {
      opacity: 0.4;
      cursor: default;
    }
    .btn-copy {
      background: rgba(109,114,89,0.15);
      border-color: rgba(109,114,89,0.3);
      font-weight: 500;
    }
    .btn-copy:hover:not(:disabled) {
      background: rgba(109,114,89,0.25);
    }
    .btn-copy.copied {
      background: rgba(109,114,89,0.3);
      color: #4a523c;
    }
    .steps {
      font-size: 11px;
      color: #877764;
      margin: 8px 0;
      padding: 6px 8px;
      background: rgba(0,0,0,0.03);
      border-radius: 4px;
      line-height: 1.7;
    }
    .steps b { color: #5a4a38; }
    .steps .num { color: #6d7259; font-weight: 600; }

    .test-result-area {
      margin-top: 8px;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      border: 1px solid transparent;
      display: none;
    }
    .test-result-area.test-ok {
      display: block;
      background: rgba(109,114,89,0.12);
      color: #4a523c;
      border-color: rgba(109,114,89,0.2);
    }
    .test-result-area.test-err {
      display: block;
      background: rgba(159,79,45,0.1);
      color: #9f4f2d;
      border-color: rgba(159,79,45,0.18);
    }
    .test-result-area.test-pending {
      display: block;
      background: rgba(189,122,54,0.1);
      color: #bd7a36;
      border-color: rgba(189,122,54,0.2);
    }
  </style>
</head>
<body>
  <div class="brand">LUCERNA</div>
  <h3>微信读书 · Cookie 助手</h3>

  <div id="status" class="status status-warn">正在检测登录状态...</div>

  <div id="cookie-area" class="cookie-area">
    <div id="result-msg" style="font-size:11px;color:#877764;margin-bottom:4px;"></div>
    <textarea id="cookie-text" readonly></textarea>
    <div class="btn-row">
      <button id="btn-copy" class="btn-copy">复制 Cookie</button>
      <button id="btn-refresh">重新读取</button>
    </div>
  </div>

  <div id="no-cookie-hint" class="steps" style="display:none;">
    <b>请先登录微信读书：</b><br>
    <span class="num">1.</span> 在 Chrome 打开 <b>weread.qq.com</b><br>
    <span class="num">2.</span> 扫码登录<br>
    <span class="num">3.</span> 回来点「重新读取」
  </div>

  <div class="steps">
    <b>如何导入到 LUCERNA：</b><br>
    <span class="num">1.</span> 点「复制 Cookie」<br>
    <span class="num">2.</span> 打开 LUCERNA → 设置 → 微信读书<br>
    <span class="num">3.</span> 粘贴到 Cookie 输入框 → 点「一键同步」
  </div>

  <div style="margin-top:10px;padding-top:8px;border-top:1px solid rgba(49,34,20,0.1);font-size:10px;color:#877764;text-align:center;">
    © @huyan
  </div>

  <script src="popup.js"></script>
</body>
</html>
